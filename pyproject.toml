[project]
name = "mcp-slide-corpus"
version = "0.1.0"
description = "Read-only MCP server over the tagged slide-deck corpus"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "openai>=1.50",
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "starlette>=0.40",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
